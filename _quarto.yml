project:
  type: default
  output-dir: _site
  render:
    - index.qmd
    - demo.qmd
    - slides/*.qmd
  resources:
    - labs/**
    - assets/**

format:
  revealjs:
    theme: [simple, styles/eywa.scss]
    width: 1280
    height: 720
    margin: 0.065
    center: false
    center-title-slide: true
    controls: true
    progress: true
    slide-number: "c/t"
    hash: true
    transition: fade
    background-transition: fade
    footer: "EYWA  /  Python · Algoritmos"
    include-after-body: assets/console-loader.html

execute:
  echo: false
