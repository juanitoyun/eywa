<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYWA · Test Python</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css">
<link rel="stylesheet" href="../assets/python-editor.css">
<style>
:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#e6f0fa;background:#081727;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-width:0;min-height:100%;background:#081727}
body{padding:14px 18px;background:linear-gradient(140deg,#071421,#0b2034)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}
.kicker{font:800 11px/1.2 system-ui;letter-spacing:.12em;color:#76d9f8;text-transform:uppercase}
.status{font:500 11px system-ui;color:#adc2d4;white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(210px,.85fr);gap:13px}
.pane{min-width:0}
.label{font:800 10px/1.3 system-ui;letter-spacing:.09em;text-transform:uppercase;color:#adc2d4;margin:0 0 7px}
textarea{display:block;width:100%;height:350px;border:1px solid #294660;border-radius:11px;background:#0b1829;color:#e6f0fa;white-space:pre;overflow-x:auto;resize:vertical;padding:12px;font:12px/1.52 ui-monospace,Consolas,monospace}
pre.output{margin:0;min-height:120px;max-height:490px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#11273e;border:1px solid #294660;border-radius:11px;padding:13px;color:#e6f0fa;font:12px/1.56 ui-monospace,Consolas,monospace}
.actions{display:flex;gap:9px;margin:12px 0 0;align-items:center}
button{border-radius:10px;padding:10px 15px;cursor:pointer;border:1px solid #294660;background:#172f49;color:#e6f0fa;font:750 12px system-ui}
button.primary{background:#227da3;border-color:#348eaf;color:#f5fcff}
button:hover:not(:disabled){border-color:#76d9f8}
button:disabled{opacity:.55;cursor:progress}
a:focus-visible,button:focus-visible{outline:2px solid #76d9f8;outline-offset:3px}
@media(max-width:670px){
 body{padding:11px}
 .cols{grid-template-columns:minmax(0,1fr);gap:12px}
 pre.output{min-height:72px;max-height:170px}
}
</style>
<link rel="stylesheet" href="../assets/eywa-dark.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/python/python.js"></script>
<script src="../assets/python-editor.js"></script>
<script src="../assets/python-console.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.js"></script>
</head>
<body>
<header>
  <div id="test-title" class="kicker">EYWA / Plantilla de test</div>
  <div id="status" class="status">Sin iniciar</div>
</header>
<main class="cols">
  <section class="pane">
    <div class="label">main.py</div>
    <textarea id="code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off"># Test</textarea>
  </section>
  <section class="pane">
    <div class="label">Consola</div>
    <pre id="output" class="output" aria-live="polite"></pre>
  </section>
</main>
<div class="actions">
  <button class="primary" type="button" id="run">▶ Ejecutar</button>
  <button type="button" id="reset">Restablecer</button>
</div>
<script>
(() => {
  "use strict";
  const el = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const rawId = params.get("id");
  // Only numbered, explicitly created files become standalone tests.
  const validId = rawId === null || /^[0-9]{1,5}$/.test(rawId);
  const testId = rawId === null ? null : rawId.padStart(3, "0");
  const defaultSource = testId ? "# Test " + testId : "# Test";

  let originalCode = defaultSource;
  let loading = null;
  let busy = false;
  el("code").value = defaultSource;
  if (testId) {
    el("test-title").textContent = "EYWA / TEST " + testId;
    document.title = "EYWA · Test " + testId;
  }
  const editor = window.EYWA_EDITOR?.create(el("code"), {
    height: Math.max(215, Math.min(510, window.innerHeight - 145)) + "px",
    label: "Editor Python",
    run: () => execute()
  }) || {
    getValue: () => el("code").value,
    setValue: value => { el("code").value = value; }
  };

  async function prepareSource() {
    if (!validId) {
      el("status").textContent = "ID inválido";
      el("run").disabled = true;
      return;
    }
    if (!testId) {
      el("status").textContent = "Plantilla";
      return;
    }
    try {
      // Same-origin Python file: one source per numbered test, never an external URL.
      const url = new URL("./tests/test-" + testId + ".py", location.href);
      const response = await fetch(url, {cache:"no-cache"});
      if (!response.ok) {
        el("status").textContent = "Test aún no publicado";
        return;
      }
      originalCode = await response.text();
      editor.setValue(originalCode);
      el("status").textContent = "Código cargado";
    } catch (error) {
      el("status").textContent = "No se pudo cargar el código";
    }
  }
  let kernel = null;
  async function python() {
    if (!kernel) {
      el("status").textContent = "Cargando Python…";
      if (typeof loadPyodide !== "function") throw new Error("No se pudo cargar Python.");
      kernel = loadPyodide().then(py => {
        el("status").textContent = "Python listo";
        return py;
      }).catch(err => {
        kernel = null;
        el("status").textContent = "Error de conexión";
        throw err;
      });
    }
    return kernel;
  }
  async function execute() {
    if (busy || !validId) return;
    busy = true;
    el("run").disabled = true;
    el("output").textContent = "";
    try {
      const py = await python();
      const source = editor.getValue();
      // Libraries available in Pyodide may be loaded on demand; no hidden checks.
      await py.loadPackagesFromImports(source);
      el("output").textContent = await window.EYWA_RUN_PYTHON(py, source);
    } catch (error) {
      el("output").textContent = String(error);
    } finally {
      busy = false;
      el("run").disabled = false;
    }
  }
  el("run").addEventListener("click", execute);
  el("reset").addEventListener("click", () => {
    editor.setValue(originalCode);
    el("output").textContent = "";
  });
  prepareSource();
})();
</script>
</body>
</html>
