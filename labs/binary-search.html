<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYWA · Mini tester de búsqueda binaria</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css">
<link rel="stylesheet" href="../assets/python-editor.css">
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#16323d;background:#fff}
*{box-sizing:border-box}body{margin:0;padding:18px 24px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px}.title{font-size:12px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:#087e72}.status{font-size:12px;color:#71848a;display:inline-flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:#d2a13c;border-radius:50%}.status.ready .dot{background:#0caa7f}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}label{font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:#59737c;display:block;margin-bottom:8px}textarea{width:100%;height:275px;min-height:190px;resize:vertical;border:1px solid #2a4a5b;border-radius:12px;background:#102737;color:#defde8;padding:14px 16px;line-height:1.53;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;outline:none}textarea:focus{border-color:#078a77;box-shadow:0 0 0 3px #17b89420}.right{display:flex;flex-direction:column;min-width:0}.description{font-size:12px;color:#637984;line-height:1.48;margin:0 0 11px}.tests{background:#f4f8f5;border:1px solid #deebe4;border-radius:12px;padding:14px 14px;flex:1;min-height:124px}.tests pre{margin:0;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.actions button{background:#087e72;border:1px solid #087e72;border-radius:10px;padding:11px 14px;color:#fff;font-size:12px;font-weight:850;cursor:pointer}.actions button:disabled{opacity:.55;cursor:wait}.tiny{font-size:11px;color:#6b818a}.error{color:#bb4234}.success{color:#067b5b}@media(max-width:680px){body{padding:13px}.layout{grid-template-columns:1fr}textarea{height:220px}.tests{min-height:110px}}
</style>
<link rel="stylesheet" href="../assets/eywa-dark.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/python/python.js"></script>
<script src="../assets/python-editor.js"></script>
<script src="../assets/python-console.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.js"></script>
</head>
<body>
<div class="header"><div class="title">EYWA / Búsqueda binaria</div><div id="status" class="status"><span class="dot"></span><span id="statusText">Python sin iniciar</span></div></div>
<div class="layout">
  <div>
    <label for="code">Tu implementación · editable</label>
    <textarea id="code" spellcheck="false" wrap="off">""" AED / 04 · Búsqueda binaria """

# binary_search: list[int], int -> int
# INPUT : lista ordenada, objetivo de búsqueda
# OUTPUT: índice encontrado o -1

def binary_search(xs, target):
    left, right = 0, len(xs) - 1                # Intervalo activo  // O(1)
    while left <= right:                        # Divide intervalo  // O(log n)
        mid = (left + right) // 2               # Posición central  // O(1)
        if xs[mid] == target:
            return mid                         # Elemento encontrado  // O(1)
        if xs[mid] < target:
            left = mid + 1
        else:
            right = mid - 1
    return -1                                   # Elemento ausente  // O(1)

# Complejidad: O(log n) tiempo; O(1) espacio

assert binary_search([2, 4, 6, 8], 6) == 2
assert binary_search([], 1) == -1</textarea>
  </div>
  <div class="right">
    <label>Consola</label>
    <div class="tests"><pre id="output" aria-live="polite"></pre></div>
    <div class="actions"><button id="run">▶ Ejecutar</button></div>
  </div>
</div>
<script>
const source = document.getElementById("code");
const output = document.getElementById("output");
const button = document.getElementById("run");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
let pyPromise = null, running = false;
const codeEditor = window.EYWA_EDITOR?.create(source,{
  height:"275px",run:()=>run(),label:"Búsqueda binaria Python"
}) || {getValue:()=>source.value,setValue:value=>{source.value=value;}};
function setStatus(value,ready=false){
  statusText.textContent=value;
  statusEl.classList.toggle("ready",ready);
}
function runtime(){
  if(!pyPromise){
    setStatus("Cargando Python…");
    if(typeof loadPyodide!=="function") return Promise.reject(new Error("No se pudo cargar Python."));
    pyPromise=loadPyodide().then(py=>{setStatus("Python listo",true);return py;})
      .catch(error=>{pyPromise=null;setStatus("Sin conexión");throw error;});
  }
  return pyPromise;
}
async function run(){
  if(running)return;
  running=true;button.disabled=true;output.textContent="";
  try{
    const py=await runtime();
    output.textContent=await window.EYWA_RUN_PYTHON(py,codeEditor.getValue());
  }catch(error){output.textContent=String(error);}
  finally{running=false;button.disabled=false;}
}
button.addEventListener("click",run);
</script>
</body>
