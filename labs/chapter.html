<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYWA · Laboratorio AED</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css">
<link rel="stylesheet" href="../assets/python-editor.css">
<style>
:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#173442;background:#fff}
*{box-sizing:border-box}body{margin:0;padding:17px 20px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.eyebrow{font:800 11px/1.3 system-ui;letter-spacing:.12em;text-transform:uppercase;color:#087e72}.subtitle{font:550 12px/1.4 system-ui;color:#637d85;margin:5px 0 0}.status{font:500 11px system-ui;white-space:nowrap;color:#617f85;border:1px solid #d8e9df;border-radius:999px;padding:7px 11px}.body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}.label{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#61808a;display:block;margin-bottom:8px}textarea{width:100%;height:320px;resize:vertical;border:1px solid #26495a;border-radius:12px;background:#102b3b;color:#dbf8ef;padding:12px 14px;font:12px/1.52 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none;tab-size:4}textarea:focus{border-color:#11a98b;box-shadow:0 0 0 2px #11a98b25}.right{display:flex;flex-direction:column;min-width:0}.desc{display:none}.output{background:#f5f9f6;border:1px solid #ddeae2;border-radius:12px;padding:14px;min-height:135px;flex:1;font:12px/1.62 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:320px}.success{color:#087658}.fail{color:#ac493d}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}button{border:1px solid #cfe1d7;border-radius:10px;padding:9px 12px;background:#fff;color:#2a4b52;font:700 11px system-ui;cursor:pointer}button.run{background:#087e72;border-color:#087e72;color:#fff}button:disabled{opacity:.58;cursor:progress}.eywa-expand{color:#087e72;text-decoration:none;font:700 11px system-ui}.hint{display:none;background:#f0f7f3;border-left:3px solid #0a8e74;margin-top:9px;padding:9px 12px;color:#40635e;font:11px/1.5 system-ui}.hint.show{display:block}.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#73868c;font-size:10px;margin-top:10px}a{color:#087e72;text-decoration:none}@media(max-width:690px){body{padding:12px}.body{grid-template-columns:1fr}textarea{height:290px}.output{min-height:95px}.foot{flex-direction:column;align-items:flex-start}}
</style>
<script src="../assets/chapter-labs.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/python/python.js"></script>
<script src="../assets/python-editor.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.js"></script>
</head>
<body>
<div class="head">
 <div><div class="eyebrow" id="title">EYWA / AED</div><p class="subtitle" id="topic">Laboratorio Python</p></div>
 <span class="status" id="status" aria-live="polite">Python sin iniciar</span>
</div>
<div class="body">
 <div><label class="label" for="editor">main.py · editable</label><textarea id="editor" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>
 <div class="right"><span class="label">Tests automáticos</span><p class="desc" id="description"></p><pre class="output" id="output" aria-live="polite">Pulsa Ejecutar para comprobar tu función.</pre></div>
</div>
<div class="actions">
 <button type="button" class="run" id="run">▶ Ejecutar tests</button>
 <button type="button" id="hintButton">Pista</button>
 <button type="button" id="reset">Restablecer</button>
 <a class="eywa-expand" id="expand" target="_blank" rel="noopener noreferrer">↗ Ampliar</a>
 <span id="score" class="subtitle">—</span>
</div>
<div id="hint" class="hint"></div>
<div class="foot"><span>Python real en navegador · Ctrl/⌘ + Enter</span><a href="https://github.com/ivansipiran/AED-Apuntes" target="_blank" rel="noopener">Temario: AED-Apuntes</a></div>
<script>
(() => {
 const id = new URLSearchParams(location.search).get("c") || "01";
 const lesson = window.EYWA_LABS?.[id];
 if (!lesson) { document.getElementById("output").textContent="Capítulo inexistente."; return; }
 const el=(x)=>document.getElementById(x);
 el("title").textContent="EYWA / "+id+" · "+lesson.title;
 el("topic").textContent=lesson.topic;
 el("expand").href=location.href;
 el("description").textContent=lesson.description;
 el("editor").value=lesson.code;
 const codeEditor=window.EYWA_EDITOR?.create(el("editor"),{height:"320px",run:()=>run(),label:"Editor Python AED"}) ||
   {getValue:()=>el("editor").value,setValue:value=>el("editor").value=value};
 el("hint").textContent=lesson.hint;
 el("score").textContent=lesson.cases.length+" pruebas preparadas";
 let runtimePromise=null, running=false;
 function setStatus(text){el("status").textContent=text;}
 function getPyodide(){
  if (!runtimePromise) {
   setStatus("Cargando Python…");
   if (typeof loadPyodide!=="function") return Promise.reject(new Error("No se cargó Pyodide. Comprueba tu conexión y las políticas del iframe."));
   runtimePromise=loadPyodide().then(py=>{setStatus("Python listo");return py;})
    .catch(e=>{runtimePromise=null;setStatus("Error de conexión");throw e;});
  }
  return runtimePromise;
 }
 const runner=[
  "import json, io, contextlib, traceback",
  "__eywa_scope = {}",
  "__eywa_print = io.StringIO()",
  "__eywa_details = []",
  "__eywa_passed = 0",
  "try:",
  "    with contextlib.redirect_stdout(__eywa_print):",
  "        exec(compile(__eywa_source, '<editor>', 'exec'), __eywa_scope)",
  "    __eywa_fun = __eywa_scope.get(__eywa_function)",
  "    if not callable(__eywa_fun):",
  "        raise NameError('No se encontró una función llamada ' + __eywa_function)",
  "    for i, case in enumerate(json.loads(__eywa_cases), 1):",
  "        try:",
  "            actual = __eywa_fun(*case['args'])",
  "            expected = case['expected']",
  "            if actual == expected:",
  "                __eywa_passed += 1",
  "                __eywa_details.append('✓ Test ' + str(i))",
  "            else:",
  "                __eywa_details.append('✗ Test ' + str(i) + ': obtuvo ' + repr(actual)[:80] + ', esperado ' + repr(expected)[:80])",
  "        except Exception as exc:",
  "            __eywa_details.append('✗ Test ' + str(i) + ': ' + str(exc)[:100])",
  "    __eywa_report = {'passed': __eywa_passed, 'total': len(json.loads(__eywa_cases)), 'details': __eywa_details, 'printed': __eywa_print.getvalue()}",
  "except Exception:",
  "    __eywa_report = {'passed': 0, 'total': len(json.loads(__eywa_cases)), 'details': [traceback.format_exc(limit=3)], 'printed': __eywa_print.getvalue()}",
  "json.dumps(__eywa_report, ensure_ascii=False)"
 ].join("\n");
 async function run(){
  if(running)return;
  running=true;el("run").disabled=true;el("output").textContent="Preparando pruebas…";
  try{
   const py=await getPyodide();
   py.globals.set("__eywa_source",codeEditor.getValue());
   py.globals.set("__eywa_function",lesson.functionName);
   py.globals.set("__eywa_cases",JSON.stringify(lesson.cases));
   const result=JSON.parse(await py.runPythonAsync(runner));
   const ok=result.passed===result.total;
   el("output").className="output "+(ok?"success":"fail");
   el("output").textContent=result.details.join("\n")+"\n\n"+result.passed+"/"+result.total+" tests superados"+(result.printed?"\n\nSalida:\n"+result.printed:"");
   el("score").textContent=result.passed+"/"+result.total+" tests";
  }catch(err){
   el("output").className="output fail";
   el("output").textContent="No fue posible ejecutar Python:\n"+String(err);
  }finally{running=false;el("run").disabled=false;}
 }
 el("run").addEventListener("click",run);
 el("reset").addEventListener("click",()=>{codeEditor.setValue(lesson.code);el("output").textContent="Código restablecido. Ejecuta nuevamente.";el("output").className="output";el("score").textContent=lesson.cases.length+" pruebas preparadas";});
 el("hintButton").addEventListener("click",()=>el("hint").classList.toggle("show"));
})();
</script>
</body>
</html>
