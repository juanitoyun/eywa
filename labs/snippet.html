<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYWA / Python ejecutable</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css">
<link rel="stylesheet" href="../assets/python-editor.css">
<style>
:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#183540;background:#fff}
*{box-sizing:border-box}
body{margin:0;padding:12px 16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}
.kicker{font:800 11px system-ui;letter-spacing:.11em;color:#087e72;text-transform:uppercase}
.title{font-size:13px;font-weight:780;letter-spacing:-.02em;margin:3px 0}
.status{font-size:11px;color:#6a8188}
.cols{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:12px}
.area{min-width:0}
label{font-size:10px;color:#5a727a;letter-spacing:.1em;text-transform:uppercase;font-weight:780;display:block;margin-bottom:5px}
textarea{display:block;width:100%;height:322px;resize:vertical;background:#1e1e1e;color:#d4d4d4;border:1px solid #333;border-radius:11px;padding:11px 13px;tab-size:4;outline:none;font:12px/1.52 ui-monospace,Consolas,monospace}
textarea:focus{border-color:#0c9c80;box-shadow:0 0 0 2px #0c9c8026}
.output{border:1px solid #dbe9e0;background:#f5f9f6;border-radius:11px;padding:12px;min-height:155px;max-height:322px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:11px/1.52 ui-monospace,Consolas,monospace;margin:0}
.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px}
button{font:750 11px system-ui;border:1px solid #c9ddd5;background:#fff;color:#1e4a4b;padding:8px 12px;border-radius:9px;cursor:pointer}
button.primary{background:#087e72;color:#fff;border-color:#087e72}
button:disabled{opacity:.65;cursor:progress}
.score{font:700 11px system-ui;color:#658179}
.ok{color:#07815d}.bad{color:#a43936}
.footer{margin-top:7px;font:10px/1.4 system-ui;color:#6e858b;display:none}.open{font:700 11px system-ui;color:#087e72;text-decoration:none}
@media(max-width:670px){body{padding:11px}.cols{grid-template-columns:1fr}.output{max-height:175px;min-height:65px}.area textarea{height:280px}.actions{gap:6px}}
</style>
<link rel="stylesheet" href="../assets/eywa-dark.css">
<link rel="stylesheet" href="../assets/eywa-visual-panel.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/python/python.js"></script>
<script src="../assets/python-editor.js"></script>
<script src="../assets/python-console.js"></script>
<script src="../assets/eywa-visual-panel.js"></script>
<script src="../assets/intro-snippets.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.js"></script>
</head>
<body>
<div class="head">
 <div><div class="kicker">EYWA · Python</div><div class="title" id="title">Código ejecutable</div></div>
 <div id="status" class="status">Sin iniciar</div>
</div>
<div class="cols">
 <div class="area"><label for="code">main.py</label><textarea id="code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>
 <div class="area"><label>Consola</label><pre id="output" class="output" aria-live="polite"></pre>
  <details class="eywa-visual-details" id="visual-details" hidden>
  <summary>Visualización <span class="eywa-visual-ready" aria-live="polite"></span></summary>
  <div class="eywa-visual-canvas" aria-label="SVG generado por el código Python"></div>
</details></div>
</div>
<div class="actions">
 <button class="primary" id="run" type="button">▶ Ejecutar</button>
 <button id="reset" type="button">Restablecer</button>
 <a class="open" id="expand" href="#" target="_blank" rel="noopener noreferrer">↗ Ampliar</a>
</div>

<div class="footer">Python en el navegador (Pyodide) · Ctrl/⌘ + Enter · No requiere notebook ni servidor</div>
<script>
(() => {
 const el = id => document.getElementById(id);
 const visualDetails=el("visual-details");
 const enableVisual=new URLSearchParams(location.search).get("visual")==="1";
 visualDetails.hidden=!enableVisual;
 const visualPanel=enableVisual ? window.EYWA_VISUAL_PANEL.mount(visualDetails) : null;
 const index = Number.parseInt(new URLSearchParams(location.search).get("s") || "1", 10) - 1;
 const lesson = window.EYWA_SNIPPETS?.slides?.[index];
 if (!lesson) { el("output").textContent = "Ejemplo no encontrado."; el("run").disabled = true; return; }
 document.title = "EYWA · " + lesson.t;
 el("title").textContent = lesson.t;
 el("code").value = lesson.code;
 el("expand").href = location.href;

 let runtimePromise = null, busy = false;
 const editor = window.EYWA_EDITOR?.create(el("code"), {
   height: "322px", label: "Python", run: () => run()
 }) || { getValue: () => el("code").value, setValue: value => {el("code").value=value;} };

 async function python() {
   if (!runtimePromise) {
     el("status").textContent = "Cargando Python…";
     if (typeof loadPyodide !== "function") throw new Error("No se pudo cargar Python.");
     runtimePromise = loadPyodide().then(py => {
       el("status").textContent = "Python listo";
       return py;
     }).catch(error => {runtimePromise=null;el("status").textContent="Sin conexión";throw error;});
   }
   return runtimePromise;
 }
 async function run() {
   if (busy) return;
   busy = true;el("run").disabled=true;
   el("output").textContent = "";
   if(visualPanel) visualPanel.clear(false);
   try {
     const py = await python();
     if (lesson.packages?.length) await py.loadPackage(lesson.packages);
     const source=editor.getValue();
     if(visualPanel){
       const result=await window.EYWA_RUN_PYTHON_WITH_VISUAL(py,source);
       el("output").textContent=result.console;
       if(result.svg)visualPanel.setSvg(result.svg);
       else if(result.dot)await visualPanel.setDot(result.dot);
     }else{
       el("output").textContent=await window.EYWA_RUN_PYTHON(py,source);
     }
   } catch (error) {
     el("output").textContent = String(error);
   } finally {
     busy=false;el("run").disabled=false;
   }
 }
 el("run").addEventListener("click",run);
 el("reset").addEventListener("click", () => {
   editor.setValue(lesson.code);el("output").textContent = "";
   if(visualPanel)visualPanel.clear();
 });
})();
</script>
</body>
</html>
