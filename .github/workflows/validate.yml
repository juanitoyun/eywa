name: Validar curso AED

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render presentations
        run: quarto render

      - name: Test Python algorithms
        run: python -m unittest discover -s tests -v

      - name: Verify public HTML entry points
        run: |
          test -f _site/index.html
          test -f _site/demo.html
          test -f _site/slides/01-introduccion.html
          test -f _site/slides/10-grafos.html
          test -f _site/labs/chapter.html
          test -f _site/assets/chapter-labs.js
